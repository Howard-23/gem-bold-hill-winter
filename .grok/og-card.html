<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #e7f6f1;
        color: #1a2e2a;
        font-family: "Outfit", ui-sans-serif, sans-serif;
      }
      .stage {
        width: 1200px;
        height: 630px;
        position: relative;
        background:
          radial-gradient(ellipse at 8% 12%, #d7f3eb 0, transparent 42%),
          radial-gradient(ellipse at 96% 88%, #c8eadf 0, transparent 46%),
          #e7f6f1;
      }
      .note {
        position: absolute;
        left: 36px;
        top: 50%;
        width: 214px;
        height: 268px;
        background:
          linear-gradient(180deg, transparent 35px, #f3e7d2 36px) 0 8px / 100% 36px,
          #fffef6;
        box-shadow: 0 18px 40px rgb(26 46 42 / 0.16);
        transform: translateY(-50%) rotate(-7deg);
        border-radius: 3px;
        padding: 22px 16px 14px;
      }
      .note .doodle {
        margin-top: 8px;
        display: block;
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -52%);
        width: 720px;
        text-align: center;
      }
      .title {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 210px;
        line-height: 0.78;
        color: #e25b6a;
      }
      .tag {
        margin-top: 28px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2f8a74;
      }
      .phone {
        position: absolute;
        right: 40px;
        top: 50%;
        width: 214px;
        height: 392px;
        transform: translateY(-50%);
        background: #111816;
        border-radius: 34px;
        padding: 8px;
        box-shadow: 0 24px 50px rgb(26 46 42 / 0.22);
      }
      .screen {
        position: relative;
        height: 100%;
        border-radius: 29px;
        overflow: hidden;
        background-color: #c9e8f4;
        background-image:
          radial-gradient(circle at 18% 22%, #7ec8ea 0 14px, transparent 15px),
          radial-gradient(circle at 24% 17%, #f7fbff 0 5px, transparent 6px),
          radial-gradient(circle at 78% 62%, #6bb6de 0 18px, transparent 19px),
          radial-gradient(circle at 84% 56%, #ffffff 0 6px, transparent 7px),
          radial-gradient(circle at 30% 78%, #8fd0ea 0 12px, transparent 13px),
          linear-gradient(180deg, #d7f1fb 0%, #b7dff2 100%);
      }
      .notch {
        position: absolute;
        top: 8px;
        left: 50%;
        width: 72px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #111816;
      }
      .sticky {
        position: absolute;
        left: 18px;
        right: 18px;
        top: 48px;
        background:
          linear-gradient(180deg, transparent 27px, #f3e7d2 28px) 0 0 / 100% 28px,
          #fffdf6;
        box-shadow: 0 10px 24px rgb(26 46 42 / 0.18);
        transform: rotate(-2deg);
        border-radius: 2px;
        padding: 10px 12px 14px;
        text-align: center;
      }
      .sticky p {
        font-family: "Caveat", cursive;
        font-weight: 700;
        font-size: 30px;
        line-height: 26px;
        color: rgb(26 46 42 / 0.82);
        padding-top: 6px;
      }
      .icons {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .icons span {
        display: block;
        height: 36px;
        border-radius: 12px;
        background: rgb(255 254 246 / 0.88);
        box-shadow: 0 2px 6px rgb(26 46 42 / 0.08);
      }
      .icons span:nth-child(1) { background: #e25b6a; }
      .icons span:nth-child(2) { background: #fffef6; }
      .icons span:nth-child(3) { background: #2f8a74; }
      .icons span:nth-child(4) { background: #1a2e2a; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="note" aria-hidden="true">
        <svg class="doodle" width="182" height="210" viewBox="0 0 206 230" fill="none">
          <path d="M40 78c0-18 14-32 32-32 10 0 18 5 24 14 6-9 14-14 24-14 18 0 32 14 32 32 0 28-36 52-56 66-20-14-56-38-56-66z" fill="#E25B6A"/>
          <path d="M148 36c8 2 18 12 20 24-10-1-18-8-22-16-2 8-10 14-18 16 2-10 8-20 14-24 2 0 4 0 6 0z" fill="#2F8A74"/>
          <path d="M36 150c18-22 28-22 40-8" stroke="#1A2E2A" stroke-width="3" stroke-linecap="round"/>
          <path d="M52 142c2 10 8 16 16 18" stroke="#2F8A74" stroke-width="3" stroke-linecap="round"/>
          <circle cx="78" cy="132" r="7" fill="#E25B6A"/>
          <path d="M118 168c16 8 34 6 48-6" stroke="#1A2E2A" stroke-width="3" stroke-linecap="round"/>
          <path d="M154 150c6 4 8 12 6 20" stroke="#2F8A74" stroke-width="3" stroke-linecap="round"/>
          <circle cx="168" cy="146" r="6" fill="#E25B6A"/>
        </svg>
      </div>
      <div class="lockup">
        <div class="title">Lovora</div>
        <div class="tag">Even when you are apart</div>
      </div>
      <div class="phone" aria-hidden="true">
        <div class="screen">
          <div class="notch"></div>
          <div class="sticky">
            <p>I love you</p>
          </div>
          <div class="icons"><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
